<style>
:root{--green:#0a8f5a;--green2:#087a4d;--green3:#065e3a;--bg:#ece5dd;--hdr:58px;--inp:62px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg)}

/* HEADER */
.ch-hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--green3);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ch-back{background:none;border:none;cursor:pointer;color:#fff;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.ch-back:hover{background:rgba(255,255,255,.15)}
.ch-back svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-av{position:relative;flex-shrink:0}
.ch-av img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.35);display:block;background:#aaa}
.ch-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:#22c55e;border-radius:50%;border:2px solid var(--green3)}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-status{font-size:11px;color:#a7f3d0;margin-top:1px}
.ch-ext-btn{background:none;border:none;cursor:pointer;color:#fff;padding:7px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.ch-ext-btn:hover{background:rgba(255,255,255,.15)}
.ch-ext-btn svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* MESSAGE LIST */
.ch-msgs{position:fixed;top:var(--hdr);left:0;right:0;bottom:var(--inp);overflow-y:auto;padding:12px 10px 6px;display:flex;flex-direction:column;gap:2px}
.ch-msgs::-webkit-scrollbar{width:3px}
.ch-msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:2px}

/* Day divider */
.day-div{text-align:center;margin:8px 0 4px;position:relative;z-index:1}
.day-div span{background:rgba(255,255,255,.85);color:#555;font-size:11px;padding:3px 12px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* Bubble row */
.msg-row{display:flex;align-items:flex-end;gap:5px;padding:1px 0}
.msg-row.out{flex-direction:row-reverse}
.av-sm{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
.msg-row.out .av-sm{display:none}
.bw{position:relative;max-width:72%}

/* Bubble */
.bubble{padding:8px 12px 6px;border-radius:18px;font-size:14px;line-height:1.45;word-break:break-word;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.msg-row.out .bubble{background:#d9fdd3;color:#111;border-bottom-right-radius:4px}
.msg-row.in  .bubble{background:#fff;color:#111;border-bottom-left-radius:4px}
.bubble.deleted{opacity:.55;font-style:italic;background:#f5f5f5!important}
.bt{font-size:10px;color:#999;margin-top:2px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.msg-row.in .bt{justify-content:flex-start}
.tick{color:#4fc3f7}
.tick.read{color:#0a8f5a}

/* Reaction on bubble */
.bubble-rxn{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid #e0e0e0;border-radius:20px;padding:2px 7px;font-size:13px;margin-top:3px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}

/* CONTEXT MENU (long press) — polished sheet */
.ctx-sheet{
  position:fixed;left:50%;transform:translateX(-50%) translateY(100%);
  bottom:0;width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;
  z-index:2000;transition:transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -4px 32px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0);
}
.ctx-sheet.open{transform:translateX(-50%) translateY(0)}
.ctx-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1999;display:none;backdrop-filter:blur(2px)}
.ctx-sheet-overlay.open{display:block}
.ctx-rxns{display:flex;justify-content:center;gap:6px;padding:16px 16px 10px}
.rxn-btn{background:#f5f5f5;border:none;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;transition:transform .15s,background .15s;display:flex;align-items:center;justify-content:center}
.rxn-btn:hover{transform:scale(1.18);background:#e8e8e8}
.rxn-btn.active{background:#e8f5e9;border:2px solid var(--green)}
.ctx-divider{height:1px;background:#f0f0f0;margin:0 16px}
.ctx-actions{padding:8px 0 10px}
.ctx-action{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;transition:background .15s;font-size:15px;font-weight:500;color:#111}
.ctx-action:hover{background:#f9f9f9}
.ctx-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ctx-action.danger{color:#e53935}
.ctx-action.danger svg{stroke:#e53935}
.ctx-cancel{display:flex;align-items:center;justify-content:center;padding:14px 20px;cursor:pointer;font-size:15px;font-weight:600;color:var(--green);border-top:1px solid #f0f0f0}

/* Typing indicator */
.typing-row{display:none;align-items:flex-end;gap:5px;padding:2px 0}
.typing-row.show{display:flex}
.typing-bub{background:#fff;border-radius:18px;border-bottom-left-radius:4px;padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.1);display:flex;gap:4px;align-items:center}
.td{width:7px;height:7px;background:#aaa;border-radius:50%;animation:td 1.4s infinite both}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{transform:scale(.75);opacity:.5}40%{transform:scale(1.1);opacity:1}}

/* Empty state */
.chat-empty{text-align:center;margin:auto;padding:32px 20px;color:#aaa}
.chat-empty svg{width:52px;height:52px;fill:none;stroke:#ccc;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 12px;display:block}
.chat-empty p{font-size:14px}

/* INPUT BAR */
.ch-inp-bar{position:fixed;bottom:0;left:0;right:0;height:var(--inp);background:#f0f0f0;display:flex;align-items:center;gap:8px;padding:0 10px;border-top:1px solid #ddd}
.inp-box{flex:1;background:#fff;border:none;border-radius:24px;padding:10px 16px;font-size:14px;font-family:Arial;color:#111;outline:none;resize:none;max-height:108px;overflow-y:auto;line-height:1.4;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.send-btn{width:44px;height:44px;background:var(--green);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .2s}
.send-btn:hover{background:var(--green2)}
.send-btn:disabled{background:#ccc;cursor:not-allowed}
.send-btn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Toast */
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-20px);background:#323232;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;z-index:3000;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

const P = profiles[pIdx] || profiles[0];
const chatId = 'chat_'+currentUser.uid+'_p'+pIdx;
const LS_KEY = 'th_msgs_'+chatId;

/* ── HEADER INIT ── */

hAv.src = P.img;
hAv.onerror = ()=>{ hAv.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38"><rect fill="%23aaa" width="38" height="38" rx="19"/></svg>'; };

document.title = 'Chat with '+P.name;
const typingAv = document.getElementById('typingAv');
typingAv.src = P.img;

/* ── ENCRYPTION ── */
const EK = 'TH_'+currentUser.uid+'_p'+pIdx;
function enc(t){
  let o='',kl=EK.length;
  for(let i=0;i<t.length;i++)o+=String.fromCharCode(t.charCodeAt(i)^EK.charCodeAt(i%kl));
  try{return btoa(unescape(encodeURIComponent(o)));}catch(e){return btoa(o);}
}
function dec(b){
  try{
    const d=decodeURIComponent(escape(atob(b)));
    let o='',kl=EK.length;
    for(let i=0;i<d.length;i++)o+=String.fromCharCode(d.charCodeAt(i)^EK.charCodeAt(i%kl));
    return o;
  }catch(e){return b;}
}

/* ── LOCAL STORAGE ── */
function loadMsgs(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return [];}}
function saveMsgs(m){localStorage.setItem(LS_KEY,JSON.stringify(m));}
let messages = loadMsgs();

/* ── CONTEXT MENU STATE ── */
let ctxMsgId = null;
let lpTimer = null;

/* ── RENDER ── */
function render(){
  const list=document.getElementById('msgList');
  const empty=document.getElementById('chatEmpty');
  const typRow=document.getElementById('typingRow');
  list.querySelectorAll('.msg-row,.day-div').forEach(e=>e.remove());
  if(!messages.length){empty.style.display='block';return;}
  empty.style.display='none';
  let lastDay='';
  const frag=document.createDocumentFragment();
  messages.forEach(m=>{
    const dt=new Date(m.ts||Date.now());
    const ds=dt.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
    if(ds!==lastDay){
      lastDay=ds;
      const sep=document.createElement('div');
      sep.className='day-div';sep.innerHTML=`<span>${ds}</span>`;
      frag.appendChild(sep);
    }
    frag.appendChild(makeBubble(m));
  });
  list.insertBefore(frag,typRow);
  scrollBottom();
}

function makeBubble(m){
  const isOut=m.sender==='user';
  const row=document.createElement('div');
  row.className='msg-row '+(isOut?'out':'in');
  row.dataset.id=m.id;

  if(!isOut){
    const av=document.createElement('img');
    av.className='av-sm';av.src=P.img;
    av.onerror=()=>{av.style.display='none';};
    row.appendChild(av);
  }

  const bw=document.createElement('div');bw.className='bw';

  const bub=document.createElement('div');
  bub.className='bubble'+(m.deleted?' deleted':'');
  if(m.deleted){
    bub.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:middle"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg><em style="color:#aaa">Message deleted</em>';
  } else {
    bub.textContent=m.text||'';
  }

  // Reaction badge
  if(m.reaction&&!m.deleted){
    const rxn=document.createElement('div');
    rxn.className='bubble-rxn';
    rxn.textContent=m.reaction;
    rxn.onclick=(e)=>{e.stopPropagation();openCtxMenu(m.id,isOut);};
    bw.appendChild(bub);bw.appendChild(rxn);
  } else {
    bw.appendChild(bub);
  }

  // Timestamp
  const t=document.createElement('div');t.className='bt';
  const ts=new Date(m.ts||Date.now()).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  t.textContent=ts;
  if(isOut){
    const tk=document.createElement('span');
    tk.className='tick'+(m.read?' read':'');
    tk.innerHTML='<svg width="16" height="10" viewBox="0 0 16 10" fill="none"><path d="M1 5l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 5l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    t.appendChild(tk);
  }
  bw.appendChild(t);
  row.appendChild(bw);

  // Long press / hold — show context sheet
  const startCtx=(e)=>{e.preventDefault&&e.preventDefault();lpTimer=setTimeout(()=>openCtxMenu(m.id,isOut),600);};
  const cancelCtx=()=>clearTimeout(lpTimer);
  bub.addEventListener('touchstart',startCtx,{passive:false});
  bub.addEventListener('touchend',cancelCtx,{passive:true});
  bub.addEventListener('touchmove',cancelCtx,{passive:true});
  bub.addEventListener('contextmenu',e=>{e.preventDefault();openCtxMenu(m.id,isOut);});

  return row;
}

function scrollBottom(){
  const l=document.getElementById('msgList');
  requestAnimationFrame(()=>{l.scrollTop=l.scrollHeight;});
}

/* ── CONTEXT SHEET ── */
const EMOJIS=['❤️','😂','😮','😢','👍','🙏'];

function openCtxMenu(msgId, isOwn){
  ctxMsgId=msgId;
  const m=messages.find(x=>x.id===msgId);
  const curRxn=m?m.reaction:null;

  // Reactions row
  const rxnRow=document.getElementById('ctxRxns');
  rxnRow.innerHTML=EMOJIS.map(e=>`
    <button class="rxn-btn ${curRxn===e?'active':''}" onclick="applyReaction('${e}')">${e}</button>
  `).join('');

  // Actions
  const acts=document.getElementById('ctxActions');
  let html='';
  if(curRxn){
    html+=`<div class="ctx-action" onclick="removeReaction()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      Remove reaction
    </div>`;
  }
  if(isOwn&&!m?.deleted){
    html+=`<div class="ctx-action danger" onclick="deleteForEveryone()">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Delete for everyone
    </div>`;
    html+=`<div class="ctx-action danger" onclick="deleteForMe()">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      Delete for me
    </div>`;
  } else if(!m?.deleted){
    html+=`<div class="ctx-action danger" onclick="deleteForMe()">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      Delete for me
    </div>`;
  }
  acts.innerHTML=html;

  document.getElementById('ctxSheet').classList.add('open');
  document.getElementById('ctxOverlay').classList.add('open');
}

function closeCtx(){
  document.getElementById('ctxSheet').classList.remove('open');
  document.getElementById('ctxOverlay').classList.remove('open');
  ctxMsgId=null;
}

function applyReaction(emoji){
  if(!ctxMsgId)return;
  const m=messages.find(x=>x.id===ctxMsgId);
  if(!m)return;
  m.reaction=m.reaction===emoji?null:emoji;
  saveMsgs(messages);render();
  // Sync to firebase
  if(window._FB){
    window._fbAddDoc(window._fbCollection(window._db,'chats',chatId,'messages'),{
      msgId:'act_'+Date.now(),sender:'admin_action',action:'react',
      targetId:ctxMsgId,reaction:m.reaction,ts:Date.now(),chatId
    }).catch(()=>{});
  }
  closeCtx();
  if(m.reaction) toast('Reaction added');
}

function removeReaction(){
  if(!ctxMsgId)return;
  const m=messages.find(x=>x.id===ctxMsgId);
  if(m){m.reaction=null;saveMsgs(messages);render();}
  closeCtx();
}

function deleteForEveryone(){
  if(!ctxMsgId)return;
  const m=messages.find(x=>x.id===ctxMsgId);
  if(!m)return;
  m.deleted=true;m.reaction=null;
  saveMsgs(messages);render();
  if(window._FB){
    window._fbAddDoc(window._fbCollection(window._db,'chats',chatId,'messages'),{
      msgId:'act_'+Date.now(),sender:'admin_action',action:'delete',
      targetId:ctxMsgId,deleteType:'everyone',ts:Date.now(),chatId
    }).catch(()=>{});
  }
  closeCtx();
  toast('Message deleted for everyone');
}

function deleteForMe(){
  if(!ctxMsgId)return;
  const idx=messages.findIndex(x=>x.id===ctxMsgId);
  if(idx>-1){messages.splice(idx,1);saveMsgs(messages);render();}
  closeCtx();
  toast('Message deleted');
}

/* ── SEND ── */
const inp=document.getElementById('msgInp');
const sendB=document.getElementById('sendBtn');
inp.addEventListener('input',function(){
  sendB.disabled=!this.value.trim();
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,108)+'px';
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});

function sendMsg(){
  const txt=inp.value.trim();if(!txt)return;
  const msg={id:'m'+Date.now()+'_'+Math.random().toString(36).slice(2,5),sender:'user',text:txt,ts:Date.now(),deleted:false,reaction:null,read:false};
  messages.push(msg);saveMsgs(messages);render();
  inp.value='';sendB.disabled=true;inp.style.height='auto';

  // Push to Firebase (encrypted)
  if(window._FB){
    window._fbAddDoc(window._fbCollection(window._db,'chats',chatId,'messages'),{
      chatId,profileIdx:pIdx,profileName:P.name,userId:currentUser.uid,
      userName:currentUser.fname+' '+(currentUser.lname||''),userPhone:currentUser.phone,
      msgId:msg.id,text:enc(txt),sender:'user',ts:msg.ts,deleted:false,reaction:null
    }).catch(()=>{});
    window._fbSetDoc(window._fbDoc(window._db,'chatMeta',chatId),{
      chatId,profileIdx:pIdx,profileName:P.name,userId:currentUser.uid,
      userName:currentUser.fname+' '+(currentUser.lname||''),userPhone:currentUser.phone,
      lastMsg:enc(txt),lastTs:msg.ts,unreadAdmin:1
    },{merge:true}).catch(()=>{});
  }
  showTyping();
}

/* ── TYPING SIMULATION ── */
let typT;
function showTyping(){
  const row=document.getElementById('typingRow');
  row.classList.add('show');scrollBottom();
  clearTimeout(typT);typT=setTimeout(()=>row.classList.remove('show'),3800);
}

/* ── LISTEN FOR SECTOR ADMIN REPLIES ── */
function listenReplies(){
  if(!window._FB)return;
  const q=window._fbQuery(window._fbCollection(window._db,'chats',chatId,'messages'),window._fbOrderBy('ts','asc'));
  window._fbOnSnapshot(q,snap=>{
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(ch.type==='added'){
        if(d.sender==='profile'){
          if(!messages.find(m=>m.id===d.msgId)){
            messages.push({id:d.msgId||ch.doc.id,sender:'profile',text:dec(d.text||''),ts:d.ts||Date.now(),deleted:d.deleted||false,reaction:d.reaction||null,read:true});
            messages.sort((a,b)=>a.ts-b.ts);
            saveMsgs(messages);
            document.getElementById('typingRow').classList.remove('show');
            render();
          }
        }
        if(d.sender==='admin_action'){
          if(d.action==='delete'){
            const m=messages.find(x=>x.id===d.targetId);
            if(m&&!m.deleted){m.deleted=true;saveMsgs(messages);render();}
          }
          if(d.action==='react'){
            const m=messages.find(x=>x.id===d.targetId);
            if(m){m.reaction=d.reaction;saveMsgs(messages);render();}
          }
        }
      }
    });
  });
}

let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800);
}
